# ── Application ─────────────────────────────────────────────
quarkus.application.name=fund-transfer
quarkus.http.port=8080

# ── Datasource (in-memory H2) ───────────────────────────────
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:fundtransfer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ── Hibernate ORM ───────────────────────────────────────────
# Mirrors Spring's ddl-auto=create-drop (schema rebuilt on each boot).
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true

# ── JWT security ────────────────────────────────────────────
# 256-bit base64 secret. Override via APP_SECURITY_JWT_SECRET in real environments.
app.security.jwt.secret=c2VjcmV0LWtleS1mb3ItZnVuZC10cmFuc2Zlci1kZW1vLWFwcC0yMDI2LW9rYXk=
app.security.jwt.expiration-minutes=60

# ── Internal (service-to-service) API key ───────────────────
# Required in the X-Service-Key header on /internal/** endpoints.
# Must match HungerBox's app.fund-transfer.service-key.
app.internal.api-key=hungerbox-to-fundtransfer-shared-key-2026

# ── Logging ─────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.lbg.fundtransfer".level=DEBUG
